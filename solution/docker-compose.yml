version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: user-api
    ports:
      - "3000:3000"

    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_NAME=usersdb

    depends_on:
      - db

    restart: on-failure

    networks:
      - app-network

  db:
    image: postgres:15-alpine

    container_name: user-db

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=usersdb
    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - app-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usersdb"]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
