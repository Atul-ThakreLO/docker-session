# =============================================================
# Docker Compose Configuration
# =============================================================
# Docker Compose is a tool for defining and running multi-container
# applications. This file describes our entire application stack:
# - Node.js API server
# - PostgreSQL database
#
# Run with: docker-compose up --build
# Stop with: docker-compose down
# Stop and remove volumes: docker-compose down -v
# =============================================================

# Compose file version (3.8 supports most modern features)
version: "3.8"

# =============================================================
# SERVICES
# =============================================================
# Services are the containers that make up your application.
# Each service can be scaled, has its own network alias, and
# can communicate with other services by their service name.
services:
  # -----------------------------------------------------------
  # Service: app (Node.js API Server)
  # -----------------------------------------------------------
  app:
    # Build configuration - tells Docker how to build this image
    build:
      context: . # Build context is current directory
      dockerfile: Dockerfile # Use our Dockerfile

    # Container name (optional, but makes it easier to identify)
    container_name: user-api

    # Port mapping: HOST_PORT:CONTAINER_PORT
    # This makes the container accessible from outside Docker
    # localhost:3000 -> container:3000
    ports:
      - "3000:3000"

    # Environment variables
    # These override any defaults in the application
    # Note: DB_HOST is 'db' (the service name) not 'localhost'
    # Docker creates an internal DNS that resolves service names
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_NAME=usersdb

    # Dependency configuration
    # depends_on controls startup ORDER, not readiness
    # The app will start AFTER db container starts, but db might
    # not be ready yet (that's why we have connectWithRetry)
    depends_on:
      - db

    # Restart policy
    # - no: Never restart (default)
    # - on-failure: Restart if container exits with error
    # - always: Always restart (good for production)
    # - unless-stopped: Always restart unless manually stopped
    restart: on-failure

    # Network configuration
    # All services in the same network can communicate by service name
    networks:
      - app-network

  # -----------------------------------------------------------
  # Service: db (PostgreSQL Database)
  # -----------------------------------------------------------
  db:
    # Use official PostgreSQL image from Docker Hub
    # postgres:15-alpine = PostgreSQL 15 on Alpine Linux (small footprint)
    image: postgres:15-alpine

    # Container name for easy identification
    container_name: user-db

    # PostgreSQL configuration via environment variables
    # These create the initial database and user on first run
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=usersdb

    # Port mapping for external access (optional)
    # Useful for connecting with database tools like pgAdmin, DBeaver
    # Remove this in production to keep DB internal only
    ports:
      - "5432:5432"

    # -----------------------------------------------------------
    # VOLUMES - Data Persistence
    # -----------------------------------------------------------
    # Volumes persist data beyond container lifecycle.
    # Without volumes, all data is lost when container is removed!
    #
    # Two types of volume mounts used here:
    volumes:
      # 1. Named Volume (pgdata)
      # Syntax: volume_name:container_path
      # - Managed by Docker
      # - Data persists even if container is deleted
      # - Can be shared between containers
      # - Located in Docker's storage area (/var/lib/docker/volumes/)
      - pgdata:/var/lib/postgresql/data

      # 2. Bind Mount (init.sql)
      # Syntax: ./host_path:container_path
      # - Maps host file/directory directly into container
      # - /docker-entrypoint-initdb.d/ is special in PostgreSQL image
      # - Any .sql or .sh files here run automatically on FIRST start
      # - Great for database initialization
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql

    # Network configuration
    networks:
      - app-network

    # Health check for PostgreSQL
    # pg_isready is a PostgreSQL utility to check if DB is accepting connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usersdb"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================
# NETWORKS
# =============================================================
# Networks allow containers to communicate with each other.
# By default, Compose creates a network for your app, but
# explicitly defining it gives you more control.
#
# Services on the same network can reach each other by service name.
# Example: From 'app', you can connect to 'db:5432'
networks:
  app-network:
    driver: bridge # Default driver, creates isolated network

# =============================================================
# VOLUMES
# =============================================================
# Named volumes are declared here and managed by Docker.
# They persist data independently of containers.
#
# To see volumes: docker volume ls
# To inspect: docker volume inspect docker-session_pgdata
# To remove: docker volume rm docker-session_pgdata
#
# WARNING: 'docker-compose down -v' removes volumes and ALL DATA!
volumes:
  pgdata:
    # driver: local is the default, stores data on host filesystem
    driver: local
